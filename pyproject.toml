[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "review-insights-agent"
version = "1.0.0"
description = "AI agent that answers software buyers' questions from user reviews, with citations, guardrails, evals and observability."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Astitva Krishna" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "sqlalchemy>=2.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=3.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
ria-import = "review_agent.ingestion.importer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_agent = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
