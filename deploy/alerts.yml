# Example alert rules. Load them by mounting this file at /etc/prometheus/alerts.yml.
groups:
  - name: review-insights-agent
    rules:
      - alert: HighErrorRate
        expr: sum(rate(ria_http_requests_total{status=~"5.."}[5m])) / sum(rate(ria_http_requests_total[5m])) > 0.05
        for: 10m
        annotations: {summary: "More than 5% of requests are failing"}
      - alert: SlowAnswers
        expr: histogram_quantile(0.95, sum(rate(ria_agent_run_seconds_bucket[10m])) by (le)) > 15
        for: 10m
        annotations: {summary: "p95 answer time above 15 seconds"}
      - alert: UngroundedAnswersRising
        expr: sum(rate(ria_answers_total{grounded="no"}[1h])) / sum(rate(ria_answers_total[1h])) > 0.10
        for: 30m
        annotations: {summary: "More than 10% of answers fell back because citations failed"}
      - alert: InjectionSpike
        expr: sum(increase(ria_guardrail_events_total{flag=~"prompt_injection.*"}[15m])) > 50
        annotations: {summary: "Unusual number of prompt-injection attempts"}
      - alert: DailySpendHigh
        expr: increase(ria_llm_cost_usd_total[24h]) > 20
        annotations: {summary: "LLM spend above 20 USD in 24 hours"}
