<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Insights Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e3e6ea; --brand:#2f5bea; --user:#2f5bea; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header small { color:var(--muted); font-weight:400; }
  button, input { font:inherit; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .btn:hover { background:#f0f2f5; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:0 0 16px; display:flex; flex-direction:column; }
  .msg.user { align-items:flex-end; }
  .bubble { max-width:88%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user .bubble { background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .bot .bubble { background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot.warn .bubble { border-color:#f0c36d; background:#fffaf0; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:10px; align-items:center; }
  .cites { margin-top:8px; max-width:88%; }
  details { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 12px; margin-top:6px; font-size:13px; }
  summary { cursor:pointer; color:var(--muted); }
  .cite { margin:8px 0; padding-top:8px; border-top:1px solid var(--line); }
  .cite b { color:var(--ink); }
  .fb button { border:0; background:none; cursor:pointer; font-size:15px; opacity:.6; }
  .fb button:hover { opacity:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .chip:hover { border-color:var(--brand); color:var(--brand); }
  form { background:var(--card); border-top:1px solid var(--line); padding:12px 20px; }
  .row { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  #msg { flex:1; padding:10px 14px; border:1px solid var(--line); border-radius:10px; }
  #send { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:0 18px; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
  #keyrow { max-width:820px; margin:8px auto 0; font-size:12px; color:var(--muted); }
  #key { border:1px solid var(--line); border-radius:6px; padding:3px 8px; width:240px; }
</style>
</head>
<body>
<header>
  <h1>Review Insights Agent <small>answers from real user reviews</small></h1>
  <button class="btn" id="new" type="button">New chat</button>
</header>

<div id="log">
  <div class="chips" id="chips"></div>
</div>

<form id="form">
  <div class="row">
    <input id="msg" autocomplete="off" maxlength="8000" placeholder="Ask about a product, e.g. Does Corvane support SSO?" autofocus>
    <button id="send" type="submit">Send</button>
  </div>
  <div id="keyrow">API key (only if the server needs one): <input id="key" type="password" autocomplete="off"></div>
</form>

<script>
const log = document.getElementById('log'), msg = document.getElementById('msg'), send = document.getElementById('send');
const keyBox = document.getElementById('key');
let sessionId = null;

const SAMPLES = [
  "Which help desk works well with WhatsApp?",
  "We're a 12-person sales team. Does Corvane support SSO?",
  "Compare Plannova and Tikkit Desk for a small team",
  "What do reviewers say about Ledgrove Books pricing?"
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // textContent only: review text is never parsed as HTML
  return e;
}
function scroll() { log.scrollTop = log.scrollHeight; }

function addUser(text) {
  const m = el('div', 'msg user'); m.append(el('div', 'bubble', text)); log.append(m); scroll();
}
function addBot(text, warn) {
  const m = el('div', 'msg bot' + (warn ? ' warn' : '')); const b = el('div', 'bubble', text); m.append(b); log.append(m); scroll();
  return {m, b};
}

function addCitations(m, cites) {
  if (!cites || !cites.length) return;
  const d = el('details'); d.append(el('summary', '', cites.length + ' review' + (cites.length > 1 ? 's' : '') + ' used'));
  cites.forEach(c => {
    const x = el('div', 'cite');
    const head = el('div'); head.append(el('b', '', '[' + c.review_id + '] '), document.createTextNode(c.product + ' · ' + c.rating + '★ · ' + c.title));
    x.append(head, el('div', '', '"' + c.excerpt + '"'));
    d.append(x);
  });
  const w = el('div', 'cites'); w.append(d); m.append(w);
}

async function feedback(requestId, score, box) {
  try {
    await call('/v1/feedback', {request_id: requestId, score});
    box.textContent = score > 0 ? 'Thanks!' : 'Thanks, we will look at this.';
  } catch (e) { box.textContent = 'Could not save feedback.'; }
}

function addMeta(m, r) {
  const meta = el('div', 'meta');
  meta.append(el('span', '', (r.latency_ms / 1000).toFixed(1) + 's'));
  const fb = el('span', 'fb');
  const up = el('button', '', '👍'), down = el('button', '', '👎');
  up.type = down.type = 'button';
  up.onclick = () => feedback(r.request_id, 1, fb);
  down.onclick = () => feedback(r.request_id, -1, fb);
  fb.append(up, down); meta.append(fb); m.append(meta);
}

async function call(path, body) {
  const headers = {'Content-Type': 'application/json'};
  if (keyBox.value.trim()) headers['X-API-Key'] = keyBox.value.trim();
  const res = await fetch(path, {method: 'POST', headers, body: JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || ('Error ' + res.status));
  return data;
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  document.getElementById('chips').style.display = 'none';
  addUser(text); msg.value = ''; send.disabled = true;
  const wait = addBot('Thinking…');
  try {
    const r = await call('/v1/chat', sessionId ? {message: text, session_id: sessionId} : {message: text});
    sessionId = r.session_id;
    wait.b.textContent = r.answer;
    if (r.status !== 'answered') wait.m.classList.add('warn');
    addCitations(wait.m, r.citations); addMeta(wait.m, r);
  } catch (e) {
    wait.b.textContent = e.message; wait.m.classList.add('warn');
  } finally { send.disabled = false; msg.focus(); scroll(); }
}

SAMPLES.forEach(s => { const c = el('button', 'chip', s); c.type = 'button'; c.onclick = () => ask(s); document.getElementById('chips').append(c); });
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); ask(msg.value); });
document.getElementById('new').onclick = () => { sessionId = null; log.querySelectorAll('.msg').forEach(n => n.remove()); document.getElementById('chips').style.display = ''; msg.focus(); };
</script>
</body>
</html>
